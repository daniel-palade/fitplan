name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-8-2-1-v1

      - name: Pre-download Gradle (cu reincercari)
        run: |
          URL="https://services.gradle.org/distributions/gradle-8.2.1-all.zip"
          DIR="$HOME/.gradle/wrapper/dists/gradle-8.2.1-all/d8pvvlun5bx6sdtwqhf8y9z4b"
          if [ -f "$DIR/gradle-8.2.1-all.zip.ok" ]; then
            echo "Gradle deja prezent din cache."
            exit 0
          fi
          mkdir -p "$DIR"
          for i in 1 2 3 4 5; do
            echo "Descarc Gradle (incercarea $i)..."
            curl -sL --connect-timeout 30 --max-time 600 -o "$DIR/gradle-8.2.1-all.zip" "$URL" && break
            sleep 10
          done
          touch "$DIR/gradle-8.2.1-all.zip.ok"

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fitplan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
